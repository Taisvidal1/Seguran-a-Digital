<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto de Vida & Matemática Aplicada</title>
    <!-- Vinculação do arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Projeto de Vida</h1>
            <p>Planejamento de objetivos futuros com matemática aplicada</p>
        </header>

        <form id="calcForm">
            <div class="form-group">
                <label for="goalName">Qual é o seu objetivo futuro?</label>
                <input type="text" id="goalName" placeholder="Ex: Faculdade, Intercâmbio, Carro..." required>
            </div>

            <div class="form-group">
                <label for="targetAmount">Valor necessário (R$):</label>
                <input type="number" id="targetAmount" placeholder="Ex: 10000" step="0.01" min="1" required>
            </div>

            <div class="form-group">
                <label for="months">Prazo para realizar (em meses):</label>
                <input type="number" id="months" placeholder="Ex: 24" min="1" required>
            </div>

            <div class="form-group">
                <label for="interestRate">Taxa de rendimento estimada (% ao ano):</label>
                <input type="number" id="interestRate" value="10" step="0.1" min="0" required>
            </div>

            <button type="button" onclick="calcularObjetivo()">Calcular Plano Financeiro</button>
        </form>

        <div class="result-card" id="resultCard">
            <h2 id="resTitle">Resumo do Objetivo</h2>
            <p>Aporte mensal necessário (investindo): <span class="highlight" id="resMonthlyInvest">R$ 0,00</span></p>
            <p>Sem investimento (guardando embaixo do colchão): <span class="highlight" id="resMonthlySimple">R$ 0,00</span></p>
            <p>Economia gerada pelos juros: <span class="highlight" id="resSavings">R$ 0,00</span></p>
        </div>
    </div>

    <!-- Vinculação do arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
